name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Run tests
        run: go test -v -race -count=1 ./...

      - name: Build binary
        run: go build -o shelldeps .

      - name: Smoke test
        run: |
          cat > /tmp/sample.sh <<'EOF'
          #!/bin/bash
          curl -s https://api.example.com | jq '.data'
          sed -i s/old/new/ config.txt
          grep -P '\d+' log.txt
          EOF
          ./shelldeps /tmp/sample.sh
          ./shelldeps --format json /tmp/sample.sh
          ./shelldeps --compat-only /tmp/sample.sh
